<style>
/* Layout: one centred reading column, tabs for sets, questions stacked below.
   Palette: cool paper and ink, one deep teal accent used for selection and answers. */
:root {
  --bg: #f5f7f8;
  --fg: #16202a;
  --muted: #5d6b78;
  --accent: #1d5c74;
  --line: #d6dee4;
  --ans: #e6f0f3;
  --accent-ink: #f5f7f8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418;
    --fg: #e4e9ee;
    --muted: #98a4b0;
    --accent: #7cc0d6;
    --line: #2a3440;
    --ans: #17242c;
    --accent-ink: #101418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418;
  --fg: #e4e9ee;
  --muted: #98a4b0;
  --accent: #7cc0d6;
  --line: #2a3440;
  --ans: #17242c;
  --accent-ink: #101418;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; }
header.top {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--line); padding-bottom: 10px;
}
h1 {
  font: 600 28px/1.2 "IBM Plex Serif", Georgia, serif;
  margin: 18px 0 6px; text-wrap: balance;
}
.lede { margin: 0 0 18px; color: var(--muted); }
.tabs {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding-bottom: 14px; border-bottom: 1px solid var(--line);
}
button {
  font: inherit; color: var(--fg); background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-selected="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}
h2 {
  font: 600 22px/1.3 "IBM Plex Serif", Georgia, serif;
  margin: 26px 0 4px;
}
.qhead {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px;
}
.qhead h3 { font: 600 17px/1.3 "IBM Plex Sans", sans-serif; margin: 0; letter-spacing: 0.01em; }
.part {
  display: grid; grid-template-columns: 3.2em 1fr; gap: 4px 10px;
  padding-block: 12px; border-bottom: 1px dotted var(--line);
}
.part:last-child { border-bottom: 0; }
.lab { font-weight: 600; color: var(--muted); }
.qtext { min-width: 0; }
.marks { display: block; text-align: right; color: var(--muted); font-size: 12.5px; white-space: nowrap; margin-top: 2px; }
.row-btns { grid-column: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.row-btns button { font-size: 13px; padding: 4px 10px; }
.answer {
  grid-column: 2; min-width: 0;
  background: var(--ans); border-left: 3px solid var(--accent);
  padding: 10px 12px; border-radius: 4px;
}
.answer[hidden] { display: none; }
.sub { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.tablewrap { overflow-x: auto; max-width: 100%; margin: 8px 0 2px; }
table.grid { border-collapse: collapse; width: 100%; max-width: 420px; }
table.grid th, table.grid td {
  border: 1px solid var(--line); padding: 6px 10px; text-align: center; min-width: 6.5em;
}
table.grid th { font-weight: 600; font-size: 13px; color: var(--muted); }
.frac {
  display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle; font-size: 0.9em; line-height: 1.15; margin: 0 2px;
}
.frac .num { border-bottom: 1px solid currentColor; padding: 0 3px; }
.frac .den { padding: 0 3px; }
sup, sub { font-size: 0.72em; line-height: 0; }
.end { margin: 26px 0 0; text-align: center; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
footer {
  margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
</style>

/* ------------------------------------------------------------------
   Tiny converter: math notation -> HTML (no external CSS or fonts needed)
   ------------------------------------------------------------------ */
var SYM = { times: "×", div: "÷", cdot: "·", neq: "≠", pm: "±", le: "≤", ge: "≥" };
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function grp(s, i) {
  var d = 0;
  for (var j = i; j < s.length; j++) {
    if (s[j] === "{") d++;
    else if (s[j] === "}") { d--; if (d === 0) return [s.slice(i + 1, j), j + 1]; }
  }
  return [s.slice(i + 1), s.length];
}
function math(s) {
  var out = "", i = 0;
  while (i < s.length) {
    var c = s[i];
    if (c === "@") {
      var m = /^[a-zA-Z]+|^[ ,;!]/.exec(s.slice(i + 1));
      if (!m) { i++; continue; }
      var name = m[0];
      i += 1 + name.length;
      if (name === "frac") {
        var a = grp(s, i); var b = grp(s, a[1]); i = b[1];
        out += '<span class="frac"><span class="num">' + math(a[0]) + '</span><span class="den">' + math(b[0]) + "</span></span>";
      } else if (SYM[name]) out += SYM[name];
      else if (name === " " || name === "," || name === ";" || name === "!") out += " ";
      else out += esc(name);
    } else if (c === "^" || c === "_") {
      i++;
      var arg;
      if (s[i] === "{") { var g = grp(s, i); arg = g[0]; i = g[1]; }
      else { arg = s[i] || ""; i++; }
      var tag = c === "^" ? "sup" : "sub";
      out += "<" + tag + ">" + math(arg) + "</" + tag + ">";
    } else if (c === "{" || c === "}") { i++; }
    else { out += esc(c); i++; }
  }
  return out;
}
function rich(s) {
  var parts = s.split("$"), out = "";
  for (var k = 0; k < parts.length; k++) {
    if (k % 2 === 0) out += esc(parts[k]).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    else out += '<span class="m">' + math(parts[k]) + "</span>";
  }
  return out;
}
function tableHTML(head, rows) {
  var h = '<div class="tablewrap"><table class="grid"><thead><tr>';
  for (var i = 0; i < head.length; i++) h += "<th>" + esc(head[i]) + "</th>";
  h += "</tr></thead><tbody>";
  for (var r = 0; r < rows.length; r++) {
    h += "<tr>";
    for (var c = 0; c < rows[r].length; c++) h += "<td>" + rich(rows[r][c]) + "</td>";
    h += "</tr>";
  }
  return h + "</tbody></table></div>";
}

function buildSet(idx) {

            '<button type="button" class="showall" aria-expanded="false">Show all</button></div>';
    for (var p = 0; p < Q.parts.length; p++) {
      var P = Q.parts[p];
      html += '<div class="part"><span class="lab">' + esc(P.l) + '</span>' +
              '<div class="qtext">' + rich(P.t) + (P.tb ? tableHTML(P.tb.h, P.tb.r) : "") +
              '<span class="marks">(' + esc(P.m) + ")</span></div>" +
              '<div class="row-btns"><button type="button" class="reveal" aria-expanded="false">Show answer</button></div>' +
              '<div class="answer" hidden></div></div>';
    }
    html += "</section>";
  }
  return html;
}

function fillAnswer(part, idx, q, p) {
  if (part.dataset.filled) return;
  var P = SETS[idx].questions[q].parts[p];
  var inner = "";
  if (P.at) inner += tableHTML(P.tb.h, P.at);
  if (P.a) inner += "<div>" + rich(P.a) + "</div>";
  part.innerHTML = inner;
  part.dataset.filled = "1";
}

function showTab(idx, pushHash) {
  var buttons = tabsEl.querySelectorAll("button");
  for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute("aria-selected", i === idx ? "true" : "false");
  panel.innerHTML = buildSet(idx);
  if (pushHash) { try { history.replaceState(null, "", "#set" + SETS[idx].no); } catch (e) {} }
}

function setAnswer(btn, show) {
  var part = btn.closest(".part");
  var ans = part.querySelector(".answer");
  if (show) { fillAnswer(ans, currentIdx, qIndex(btn), pIndex(part)); }
  ans.hidden = !show;
  btn.textContent = show ? "Hide answer" : "Show answer";
  btn.setAttribute("aria-expanded", show ? "true" : "false");
}
function qIndex(el) { return Number(el.closest(".q").dataset.q) - 1; }
function pIndex(part) {
  var parts = part.closest(".q").querySelectorAll(".part");
  for (var i = 0; i < parts.length; i++) if (parts[i] === part) return i;
  return 0;
}

var currentIdx = 0;

tabsEl.innerHTML = SETS.map(function (s, i) {
  return '<button type="button" role="tab" aria-selected="false" data-i="' + i + '">Set ' + s.no + "</button>";
}).join("");

tabsEl.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-i]");
  if (!b) return;
  currentIdx = Number(b.dataset.i);
  showTab(currentIdx, true);
});

panel.addEventListener("click", function (e) {
  var btn = e.target.closest("button");
  if (!btn) return;
  if (btn.classList.contains("reveal")) {
    setAnswer(btn, btn.getAttribute("aria-expanded") !== "true");
  } else if (btn.classList.contains("showall")) {
    var sec = btn.closest(".q");
    var reveals = sec.querySelectorAll("button.reveal");
    var openAll = btn.getAttribute("aria-expanded") !== "true";
    for (var i = 0; i < reveals.length; i++) setAnswer(reveals[i], openAll);
    btn.textContent = openAll ? "Hide all" : "Show all";
    btn.setAttribute("aria-expanded", openAll ? "true" : "false");
  }
});

// Deep link to a set with a bare token, e.g. #set3
var start = 0;
var m = /^set(\d+)$/.exec(location.hash.slice(1));
if (m) { var n = Number(m[1]) - 1; if (n >= 0 && n < SETS.length) start = n; }
currentIdx = start;
showTab(start, false);
</script>
